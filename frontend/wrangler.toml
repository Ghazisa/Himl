# Cloudflare Pages configuration for the Himl frontend.
#
# Set the Pages project's root directory to `frontend` in the dashboard; every
# other build setting is read from this file.

name = "himl"
pages_build_output_dir = "dist"
compatibility_date = "2026-08-01"

[vars]
# The Render service that functions/api/[[path]].js proxies to. Confirmed live —
# /healthz returns {"status": "ok"}. Update this if the service is ever renamed.
BACKEND_ORIGIN = "https://himl-api.onrender.com"
